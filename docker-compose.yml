version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mydatabase}
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myuser} -d ${DB_NAME:-mydatabase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DB_NAME=${DB_NAME:-mydatabase}
      - DB_USER=${DB_USER:-myuser}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - DB_HOST=postgres
      - DB_PORT=5432
      - HUGGING_FACE_TOKEN=${HUGGING_FACE_TOKEN}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_HOSTS=backend,localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # C# Validation & Middleware Service
  validation:
    build:
      context: ./DrAiAssistant.Validation
      dockerfile: Dockerfile
    environment:
      - BackendApi__BaseUrl=http://backend:8000
      - RateLimiting__MaxRequestsPerMinute=30
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:3001
      - Cors__AllowedOrigins__2=http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped

  # React Chat App (Frontend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - validation
    restart: unless-stopped

  # Vite Landing Page
  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    ports:
      - "5173:80"
    restart: unless-stopped

  # Local LLM Inference (Ollama) — optional, for offline mode
  # Uncomment below to use local LLM instead of Hugging Face API
  # llm-inference:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 8G
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

volumes:
  postgres_data:
  # ollama_data:
